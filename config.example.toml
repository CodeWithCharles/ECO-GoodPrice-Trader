# Copy this file to `config.toml` and fill it in.
#
# `config.toml` is in the .gitignore: it is the only place a token is
# allowed to live. If you would rather not write it down at all, leave
# `token` empty and export the ECO_AUTH_TOKEN environment variable, or
# let the app ask you for it with hidden input.
#
# Settings priority: CLI argument > env variable > this file.

[server]
# URL of the Eco server, web server port included.
url = "http://eco.sg1-server.com:3001"

# X-Auth-Token ("world ticket"). It expires after 24 h.
# Where to find it: in game, open the GoodPrice plugin, then in the
# browser dev tools -> Application -> Local Storage -> key
# `worldTicketData`, field `worldTicket`.
token = ""


[trading]
# Currency analysed. Leave it commented out to automatically pick the
# most widespread currency on the server (often "Calories").
# currency = "Calories"

# Starting cash. 0 = unlimited: everything profitable is shown, with no
# regard for your purse. Set your real balance to get a chain you can
# actually run.
capital = 0

# Ignores routes earning less than this, to clear out the noise of
# two-cent micro-margins.
min_profit = 0.5

# Number of lines printed by `Routes.py` (0 = all of them).
top = 25


[activity]
# Days without seeing the player online before showing a warning.
absent_days = 7

# Days without the slightest change in their stores (price, stock,
# balance) before showing a warning. Complementary to the previous one:
# this signal works even if the /players endpoint is missing.
stale_days = 14


[blacklist]
# Matching is PARTIAL and case-insensitive: "dump" is enough to rule
# out "<color=grey>Twitch's Dumping Grounds</color>".
#
# Your own stores are already excluded automatically (buying from
# yourself earns nothing): use --include-own to bring them back.

# Players you do not want to trade with.
players = []

# Specific stores to ignore (dumps, test stores, etc.).
stores = []

# Items never to trade (bulky ones, or ones you keep for yourself).
items = []